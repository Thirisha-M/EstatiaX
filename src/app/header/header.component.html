<header class="header">
    <div class="logo">
      <img src="\assets\images\website logo.jpg" alt="EstatiaX Logo" />
      <span class="logo-text">{{ logoText }}</span>  <!-- Dynamic logo text -->
    </div>
  
    <nav class="navigation">
      <ul>
        <li><a routerLink="/">Home</a></li>
        <li>
          <a href="#">Properties</a>
          <ul class="dropdown">
            <li><a routerLink="/rent">Rent</a></li>
            <li><a routerLink="/buy">Buy</a></li>
            <li><a routerLink="/sell">Sell</a></li>
          
          </ul>
        </li>
        <li><a routerLink="/about">About Us</a></li>
        <li><a routerLink="/contact">Contact</a></li>
      </ul>
    </nav>
  
    <div class="search-bar">
      <input type="text" [(ngModel)]="searchQuery" placeholder="Search properties..." />  <!-- Two-way binding -->
    </div>
  
    <div class="user-menu">
      <a *ngIf="!isLoggedIn" routerLink="/login"><i class="fa fa-user"></i> Login/Register</a>  <!-- Conditional rendering -->
      <a *ngIf="isLoggedIn" routerLink="/profile"><i class="fa fa-user-circle"></i> Profile</a>  <!-- Conditional rendering -->
    </div>
  
    <button class="cta-button" (click)="postProperty()">{{ postButtonText }}</button> <!-- Dynamic text for the button -->
  </header>
